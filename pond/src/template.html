<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Still Water</title>
<meta name="description" content="A peaceful 3D pond at golden hour. Scene modelled in Blender, rendered live in your browser.">
<style>
  :root { --ink:#fff; --glass:rgba(18,26,22,.38); --edge:rgba(255,255,255,.22); --accent:#ffd9a0; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:#0d1512; overflow:hidden; font:500 14px/1.3 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif; color:var(--ink); }
  #c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  #c:active { cursor:grabbing; }
  .vig { position:fixed; inset:0; pointer-events:none; background:radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(8,14,12,.5) 100%); }
  #loader { position:fixed; inset:0; display:grid; place-content:center; justify-items:center; gap:14px; background:radial-gradient(circle at 50% 40%, #1d3a2e, #0a1210 70%); transition:opacity 1.6s ease, visibility 1.6s; z-index:10; text-align:center; }
  body.ready #loader { opacity:0; visibility:hidden; }
  #loader h1 { margin:0; font:300 clamp(34px,7vw,64px)/1 "Iowan Old Style","Palatino Linotype",Georgia,serif; letter-spacing:.18em; text-transform:uppercase; padding-left:.18em; }
  #loader p { margin:0; opacity:.7; letter-spacing:.08em; }
  .ring { width:46px; height:46px; border-radius:50%; border:2px solid rgba(255,255,255,.15); border-top-color:var(--accent); animation:sp 1.1s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  .title { position:fixed; left:max(18px,env(safe-area-inset-left)); top:max(16px,env(safe-area-inset-top)); pointer-events:none; text-shadow:0 1px 14px rgba(0,0,0,.45); opacity:0; transition:opacity 2s 3s; }
  body.ready .title, body.ready .bar { opacity:1; }
  .title b { display:block; font:300 22px/1.1 "Iowan Old Style","Palatino Linotype",Georgia,serif; letter-spacing:.2em; text-transform:uppercase; }
  .title span { opacity:.75; font-size:12px; letter-spacing:.12em; text-transform:uppercase; }
  .bar { position:fixed; left:50%; bottom:max(16px,env(safe-area-inset-bottom)); transform:translateX(-50%); display:flex; flex-wrap:wrap; justify-content:center; gap:8px; max-width:calc(100vw - 24px); opacity:0; transition:opacity 2s 3s, transform .5s; }
  .grp { display:flex; gap:4px; padding:4px; border-radius:999px; background:var(--glass); border:1px solid var(--edge); backdrop-filter:blur(14px) saturate(1.3); -webkit-backdrop-filter:blur(14px) saturate(1.3); }
  button { font:inherit; color:inherit; background:transparent; border:0; padding:9px 14px; border-radius:999px; cursor:pointer; transition:background .25s, color .25s; white-space:nowrap; }
  button:hover { background:rgba(255,255,255,.14); }
  button.on { background:rgba(255,236,200,.92); color:#2a2418; }
  button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .hint { position:fixed; right:max(18px,env(safe-area-inset-right)); top:max(16px,env(safe-area-inset-top)); font-size:12px; opacity:.6; text-align:right; pointer-events:none; text-shadow:0 1px 10px rgba(0,0,0,.5); }
  body.clean .bar, body.clean .title, body.clean .hint { opacity:0 !important; pointer-events:none; transition:opacity .4s; }
  body.clean .bar { transform:translateX(-50%) translateY(20px); }
  @media (max-width:640px){ .hint{display:none} button{padding:8px 11px} }
  @media (prefers-reduced-motion:reduce){ .ring{animation-duration:3s} }
</style>
</head>
<body>
<canvas id="c" aria-label="A peaceful pond with grass, lily pads, ducks and koi. Drag to look around."></canvas>
<div class="vig"></div>
<div class="title"><b>Still Water</b><span id="mood">Golden hour</span></div>
<div class="hint">drag to look around · scroll to zoom · click the water<br>1–4 time of day · H hides the interface</div>
<div class="bar" role="toolbar" aria-label="Controls">
  <div class="grp" role="group" aria-label="Time of day">
    <button data-time="golden" class="on">🌅 Golden</button>
    <button data-time="midday">☀️ Day</button>
    <button data-time="twilight">🌆 Twilight</button>
    <button data-time="night">🌙 Night</button>
    <button id="cycle" title="Drift through the day">⟳</button>
  </div>
  <div class="grp">
    <button id="sound">🔈 Sound off</button>
    <button id="orbit" class="on">Orbit</button>
    <button id="shot" title="Save a picture">📷</button>
    <button id="hide" title="Hide interface (H)">⤢</button>
  </div>
</div>
<div id="loader"><h1>Still Water</h1><div class="ring"></div><p id="loadmsg">Waking up…</p></div>
<script>window.__POND_GLB_GZ="/*GLB*/";</script>
<script>/*BUNDLE*/</script>
</body>
</html>
