<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#14181f">
<title>Zip to Jar</title>
<link rel="manifest" href="manifest.webmanifest">
<style>
  :root { --bg:#14181f; --card:#1d232d; --fg:#e8ecf2; --mute:#8b95a5; --ok:#4cc38a; --warn:#f0b429; --err:#ef5b5b; --acc:#5b9cf0; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui,sans-serif; max-width:560px; margin-inline:auto; }
  h1 { font-size:1.4rem; margin:8px 0 4px; }
  p.sub { margin:0 0 16px; color:var(--mute); }
  .card { background:var(--card); border-radius:14px; padding:16px; margin-bottom:14px; }
  label.pick { display:block; text-align:center; padding:28px 12px; border:2px dashed var(--mute); border-radius:14px; cursor:pointer; }
  label.pick strong { color:var(--acc); }
  input[type=file] { display:none; }
  button { width:100%; padding:16px; font-size:1.05rem; font-weight:600; border:0; border-radius:12px; background:var(--acc); color:#fff; }
  button:disabled { opacity:.4; }
  .row { display:flex; justify-content:space-between; gap:12px; padding:4px 0; }
  .row span:first-child { color:var(--mute); }
  .msg { padding:10px 12px; border-radius:10px; margin-top:8px; font-size:.95rem; }
  .msg.ok { background:#4cc38a22; color:var(--ok); }
  .msg.warn { background:#f0b42922; color:var(--warn); }
  .msg.err { background:#ef5b5b22; color:var(--err); }
  .opt { display:flex; align-items:center; gap:10px; padding:6px 0; }
  .opt input { width:20px; height:20px; }
  input[type=text] { width:100%; padding:12px; border-radius:10px; border:1px solid #333c4a; background:var(--bg); color:var(--fg); font-size:1rem; }
  a.dl { display:block; text-align:center; margin-top:10px; color:var(--acc); }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<h1>Zip to Jar</h1>
<p class="sub">Turns a Minecraft mod/plugin .zip into a .jar. Runs fully on your device.</p>

<div class="card">
  <label class="pick" for="file"><strong id="pickText">Tap to choose a .zip file</strong></label>
  <input id="file" type="file" accept=".zip,application/zip,application/x-zip-compressed,application/octet-stream">
</div>

<div class="card" id="info" hidden>
  <div class="row"><span>Detected</span><span id="kind"></span></div>
  <div class="row"><span>Files</span><span id="count"></span></div>
  <div id="msgs"></div>
</div>

<div class="card" id="opts" hidden>
  <div class="opt"><input type="checkbox" id="strip" checked><label for="strip">Remove wrapper folder if there is one</label></div>
  <div class="opt"><input type="checkbox" id="manifest" checked><label for="manifest">Add META-INF/MANIFEST.MF if missing</label></div>
  <div style="margin-top:8px"><label for="name" style="color:var(--mute)">Output name</label>
  <input type="text" id="name" autocapitalize="off" autocomplete="off"></div>
</div>

<button id="go" disabled>Convert to .jar</button>
<a id="again" class="dl" hidden>Download didn't start? Tap here</a>

<script src="jszip.min.js"></script>
<script>
"use strict";
const $ = id => document.getElementById(id);
let zip = null, srcName = "", paths = [], prefix = "";

function addMsg(cls, text) {
  const d = document.createElement("div");
  d.className = "msg " + cls;
  d.textContent = text;
  $("msgs").appendChild(d);
}

// Folder prefix shared by every entry, e.g. "MyMod/" (empty string if none).
function commonWrapper(files) {
  if (!files.length) return "";
  const first = files[0].split("/")[0];
  if (!files.every(p => p.startsWith(first + "/"))) return "";
  return first + "/";
}

const LOADERS = [
  ["fabric.mod.json", "Fabric mod"],
  ["quilt.mod.json", "Quilt mod"],
  ["META-INF/neoforge.mods.toml", "NeoForge mod"],
  ["META-INF/mods.toml", "Forge mod"],
  ["mcmod.info", "Old Forge mod"],
  ["plugin.yml", "Bukkit/Spigot/Paper plugin"],
  ["paper-plugin.yml", "Paper plugin"],
  ["bungee.yml", "BungeeCord plugin"],
  ["velocity-plugin.json", "Velocity plugin"],
];

function analyse() {
  const rel = p => (prefix && $("strip").checked ? p.slice(prefix.length) : p);
  const set = new Set(paths.map(rel));
  const hasClass = [...set].some(p => p.endsWith(".class"));
  const hasJava = [...set].some(p => p.endsWith(".java"));
  const hit = LOADERS.find(([f]) => set.has(f));
  $("msgs").innerHTML = "";
  $("count").textContent = paths.length;

  if (hit) $("kind").textContent = hit[1];
  else if (set.has("pack.mcmeta") && !hasClass) $("kind").textContent = "Resource/data pack";
  else if (hasClass) $("kind").textContent = "Java classes (no mod metadata)";
  else if (hasJava) $("kind").textContent = "Source code";
  else $("kind").textContent = "Unknown";

  if (prefix && !$("strip").checked)
    addMsg("warn", `Everything is inside "${prefix}". Loaders usually need files at the top level.`);
  if (hit && hasClass) addMsg("ok", "Looks like a ready-to-use mod/plugin. Conversion should work.");
  else if (hit && !hasClass) addMsg("warn", "Mod metadata found but no compiled .class files, so it won't do anything in game.");
  else if (hasJava && !hasClass) addMsg("err", "This contains source (.java) only. A .jar needs compiled .class files. Compile it first (e.g. Gradle), then zip the output.");
  else if (set.has("pack.mcmeta") && !hasClass) addMsg("warn", "This is a resource/data pack. Those should stay as .zip. Minecraft won't load them as a .jar.");
  else if (!hasClass) addMsg("warn", "No .class files and no mod metadata found. The jar may not load.");
}

$("file").addEventListener("change", async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("go").disabled = true;
  $("again").hidden = true;
  try {
    zip = await JSZip.loadAsync(f);
  } catch (err) {
    zip = null;
    $("info").hidden = false; $("opts").hidden = true;
    $("kind").textContent = "—"; $("count").textContent = "—";
    $("msgs").innerHTML = "";
    addMsg("err", "That doesn't look like a valid zip file.");
    return;
  }
  srcName = f.name;
  $("pickText").textContent = f.name;
  paths = Object.keys(zip.files).filter(p => !zip.files[p].dir && !p.startsWith("__MACOSX/"));
  prefix = commonWrapper(paths);
  $("strip").checked = !!prefix;
  $("strip").parentElement.hidden = !prefix;
  $("name").value = f.name.replace(/\.zip$/i, "").replace(/[^\w.\-+ ()]/g, "_") + ".jar";
  $("info").hidden = false; $("opts").hidden = false;
  analyse();
  $("go").disabled = paths.length === 0;
});
$("strip").addEventListener("change", () => zip && analyse());

$("go").addEventListener("click", async () => {
  $("go").disabled = true; $("go").textContent = "Working…";
  try {
    const out = new JSZip();
    const strip = prefix && $("strip").checked;
    for (const p of paths) {
      const name = strip ? p.slice(prefix.length) : p;
      if (!name) continue;
      out.file(name, await zip.files[p].async("uint8array"), { date: zip.files[p].date });
    }
    if ($("manifest").checked && !out.file("META-INF/MANIFEST.MF"))
      out.file("META-INF/MANIFEST.MF", "Manifest-Version: 1.0\r\nCreated-By: Zip to Jar\r\n\r\n");

    const blob = await out.generateAsync({ type: "blob", compression: "DEFLATE", mimeType: "application/java-archive" });
    let name = $("name").value.trim() || "output.jar";
    if (!/\.jar$/i.test(name)) name += ".jar";

    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    $("again").href = url; $("again").download = name; $("again").hidden = false;
    addMsg("ok", `Saved ${name} (${(blob.size / 1024).toFixed(1)} KB). Check your Downloads folder.`);
  } catch (err) {
    addMsg("err", "Conversion failed: " + err.message);
  }
  $("go").disabled = false; $("go").textContent = "Convert to .jar";
});

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
