<title>Vice Streets</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&display=swap">
<style>
/* Layout: one full-bleed canvas; HUD is painted on the canvas. Single dark look by choice. */
:root{--bg:#0d0f12;--fg:#f2efe6;color-scheme:dark}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100%;height:100%;cursor:crosshair}
</style>
<canvas id="c"></canvas>
<script>
const C=document.getElementById('c'),X=C.getContext('2d');
let W,H,DPR;function rs(){DPR=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;C.width=W*DPR;C.height=H*DPR}rs();addEventListener('resize',rs);
const FONT='"Anton",Impact,"Arial Black",sans-serif';
const CELL=400,ROAD=100,SW=20,N=12,WORLD=N*CELL+ROAD,PI=Math.PI;
const rnd=(a,b)=>a+Math.random()*(b-a),ang=a=>Math.atan2(Math.sin(a),Math.cos(a)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clamp=(v,a,b)=>v<a?a:v>b?b:v;

// ---------- city ----------
const cells=[];
for(let i=0;i<N;i++){cells[i]=[];for(let j=0;j<N;j++){
  const park=Math.random()<.12,trees=[],ac=[];
  for(let k=0;k<7;k++)trees.push([rnd(140,360),rnd(140,360),rnd(12,22)]);
  for(let k=0;k<3;k++)ac.push([rnd(150,330),rnd(150,330),rnd(14,30),rnd(10,22)]);
  const hue=[200,30,15,45,180,0,260][(Math.random()*7)|0];
  cells[i][j]={park,trees,ac,col:`hsl(${hue},${rnd(8,22)|0}%,${rnd(30,46)|0}%)`,roof:`hsl(${hue},${rnd(6,16)|0}%,${rnd(48,60)|0}%)`};
}}
function cellAt(x,y){const i=Math.floor(x/CELL),j=Math.floor(y/CELL);return(i<0||j<0||i>=N||j>=N)?null:cells[i][j]}
function solid(x,y){
  if(x<0||y<0||x>WORLD||y>WORLD)return true;
  const c=cellAt(x,y);if(!c||c.park)return false;
  const mx=x%CELL,my=y%CELL;return mx>ROAD+SW&&my>ROAD+SW&&mx<CELL-SW&&my<CELL-SW;
}
const isRoad=(x,y)=>x%CELL<ROAD||y%CELL<ROAD;

// ---------- state ----------
const TH=[0,1,3,6,10,15];
const HOSP={x:6*CELL+110,y:6*CELL+60};
const P={x:HOSP.x,y:HOSP.y,a:0,hp:100,car:null,money:0,heat:0,lastSeen:0,cool:0,hitCd:0,dead:0,walk:0,kills:0};
let cars=[],peds=[],bullets=[],parts=[],decals=[],pickups=[],frame=0,shake=0,msgs=[],nextId=1;
const cam={x:P.x,y:P.y,z:1};
let mission=null;
const COLS=['#c0392b','#2e86de','#f1c40f','#ecf0f1','#27ae60','#8e44ad','#e67e22','#16a085','#34495e','#d35400','#bdc3c7','#ff6b9d'];
const SHIRTS=['#e74c3c','#3498db','#f39c12','#9b59b6','#1abc9c','#ecf0f1','#2c3e50','#e84393','#fdcb6e'];
const SKIN=['#f1c27d','#c68642','#8d5524','#ffdbac','#e0ac69'];
function wanted(){let w=0;for(let i=1;i<6;i++)if(P.heat>=TH[i])w=i;return w}
function crime(n){P.heat=Math.min(20,P.heat+n);P.lastSeen=0}
function msg(t,col='#fff'){msgs.push({t,col,life:150})}

// ---------- input ----------
const keys={};let mx=0,my=0,mdown=false,touchMode=false;
addEventListener('keydown',e=>{if(!keys[e.code]&&(e.code==='KeyE'||e.code==='KeyF'))toggleCar();keys[e.code]=1;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>keys[e.code]=0);
C.addEventListener('mousemove',e=>{mx=e.clientX;my=e.clientY;touchMode=false});
C.addEventListener('mousedown',e=>{if(e.button===0)mdown=true});
addEventListener('mouseup',()=>mdown=false);
C.addEventListener('contextmenu',e=>e.preventDefault());
let joy={id:null,sx:0,sy:0,dx:0,dy:0},fireT=null;
const btns=()=>[{n:'fire',x:W-80,y:H-100,r:44,l:'FIRE'},{n:'car',x:W-175,y:H-60,r:32,l:'CAR'}];
C.addEventListener('touchstart',e=>{e.preventDefault();touchMode=true;
  for(const t of e.changedTouches){const b=btns().find(b=>Math.hypot(t.clientX-b.x,t.clientY-b.y)<b.r+12);
    if(b){if(b.n==='car')toggleCar();else fireT=t.identifier}
    else if(t.clientX<W*.6&&joy.id===null)joy={id:t.identifier,sx:t.clientX,sy:t.clientY,dx:0,dy:0};
    if(P.dead===0&&gameOver)restart();}},{passive:false});
C.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier===joy.id){let dx=t.clientX-joy.sx,dy=t.clientY-joy.sy;const m=Math.hypot(dx,dy);if(m>60){dx*=60/m;dy*=60/m}joy.dx=dx;joy.dy=dy}},{passive:false});
function tend(e){for(const t of e.changedTouches){if(t.identifier===joy.id)joy={id:null,sx:0,sy:0,dx:0,dy:0};if(t.identifier===fireT)fireT=null}}
C.addEventListener('touchend',tend);C.addEventListener('touchcancel',tend);
let gameOver=false;function restart(){}

// ---------- entities ----------
function makeCar(x,y,a,driver,cop){return{id:nextId++,x,y,a,la:a,sp:driver==='npc'?3:0,hp:cop?140:100,col:cop?'#111':COLS[(Math.random()*COLS.length)|0],driver,cop:!!cop,stun:0,wreck:0,stuck:0,rev:0,max:cop?8.6:rnd(8,11)}}
function laneSpot(minD,maxD){
  for(let t=0;t<40;t++){
    const v=Math.random()<.5,dir=Math.random()<.5;
    const k=clamp(Math.round((v?P.x:P.y)/CELL)+((Math.random()*9)|0)-4,0,N);
    const along=(v?P.y:P.x)+rnd(-maxD,maxD);
    if(along<20||along>WORLD-20)continue;
    let x,y,a;
    if(v){x=k*CELL+(dir?28:72);y=along;a=dir?PI/2:-PI/2}else{y=k*CELL+(dir?72:28);x=along;a=dir?0:PI}
    const d=Math.hypot(x-P.x,y-P.y);
    if(d>minD&&d<maxD&&!cars.some(c=>Math.hypot(c.x-x,c.y-y)<80))return{x,y,a};
  }return null}
function sidewalkSpot(minD,maxD){
  for(let t=0;t<40;t++){
    const x0=P.x+rnd(-maxD,maxD),y0=P.y+rnd(-maxD,maxD);
    const i=Math.floor(x0/CELL),j=Math.floor(y0/CELL);if(i<0||j<0||i>=N||j>=N)continue;
    let x,y;const along=rnd(ROAD+8,CELL-8),side=Math.random()<.5?ROAD+10:CELL-10;
    if(Math.random()<.5){x=i*CELL+side;y=j*CELL+along}else{x=i*CELL+along;y=j*CELL+side}
    const d=Math.hypot(x-P.x,y-P.y);if(d>minD&&d<maxD&&!solid(x,y))return{x,y};
  }return null}
function makePed(x,y){return{x,y,a:rnd(0,7),dead:0,flee:0,shirt:SHIRTS[(Math.random()*SHIRTS.length)|0],skin:SKIN[(Math.random()*SKIN.length)|0],step:rnd(0,7)}}

function newMission(){let s=null;for(let t=0;t<50&&!s;t++){const i=(Math.random()*N)|0,j=(Math.random()*N)|0;const x=i*CELL+rnd(ROAD+10,CELL-10),y=j*CELL+ROAD+10;if(Math.hypot(x-P.x,y-P.y)>1100)s={x,y}}
  mission=s||{x:ROAD+10,y:ROAD+10};const d=Math.hypot(mission.x-P.x,mission.y-P.y);mission.reward=Math.round((150+d/8)/10)*10;mission.t0=frame}

// ---------- particles ----------
function puff(x,y,n,col,sp=3,size=4,life=40){for(let i=0;i<n;i++){const a=rnd(0,7),s=rnd(0,sp);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:rnd(life*.5,life),max:life,col,size:rnd(size*.5,size)})}}
function blood(x,y){decals.push({x,y,r:rnd(10,18),t:'b'});if(decals.length>120)decals.shift();puff(x,y,10,'#a00',2.5,3,25)}

// ---------- combat ----------
function killPed(p,src){if(p.dead)return;p.dead=1;blood(p.x,p.y);if(Math.random()<.6)pickups.push({x:p.x+rnd(-8,8),y:p.y+rnd(-8,8),v:Math.round(rnd(1,10))*10,t:'$'});
  if(src==='player'){crime(1);P.kills++}scare(p.x,p.y,260)}
function scare(x,y,r){for(const p of peds)if(!p.dead&&Math.hypot(p.x-x,p.y-y)<r)p.flee=220;for(const c of cars)if(c.driver==='npc'&&Math.hypot(c.x-x,c.y-y)<r)c.panic=200}
function damageCar(c,amt,src){if(c.wreck)return;c.hp-=amt;if(src==='player'&&c.cop)crime(.35);if(c.hp<=0)explode(c,src)}
function explode(c,src){c.wreck=1;c.sp*=.2;c.hp=0;if(src==='player'&&c.cop)crime(2);
  if(c.driver==='npc'&&Math.random()<.7){}// driver lost
  if(P.car===c){P.car=null;P.hp-=45;exitSpot(c)}
  c.driver=null;boom(c.x,c.y,src)}
function boom(x,y,src){shake=Math.max(shake,18);
  puff(x,y,30,'#ffb300',6,9,35);puff(x,y,25,'#ff3d00',4,10,45);puff(x,y,20,'#333',2,14,90);
  decals.push({x,y,r:40,t:'s'});scare(x,y,500);
  for(const p of peds)if(!p.dead&&Math.hypot(p.x-x,p.y-y)<95)killPed(p,src);
  for(const c of cars)if(!c.wreck&&Math.hypot(c.x-x,c.y-y)<95)damageCar(c,60,src);
  if(!P.car&&Math.hypot(P.x-x,P.y-y)<95)hurt(45)}
function hurt(n){if(P.dead)return;P.hp-=n;shake=Math.max(shake,6);if(P.hp<=0)die()}
function die(){P.hp=0;P.dead=200;if(P.car){P.car.driver=null;P.car=null}blood(P.x,P.y);msg('','#fff')}
function respawn(){Object.assign(P,{x:HOSP.x,y:HOSP.y,hp:100,heat:0,car:null,lastSeen:0});const fee=Math.min(P.money,500);P.money-=fee;
  cars=cars.filter(c=>!c.cop);msg(fee?`Hospital bill -$${fee}`:'Back on your feet','#ff6b6b');newMission()}
function shoot(x,y,a,owner,spread=.04){const aa=a+rnd(-spread,spread);bullets.push({x,y,vx:Math.cos(aa)*16,vy:Math.sin(aa)*16,life:50,owner});puff(x+Math.cos(a)*4,y+Math.sin(a)*4,3,'#ffd54f',1.5,3,8)}

// ---------- car control ----------
function corners(x,y,a){const ca=Math.cos(a),sa=Math.sin(a);return[[22,10],[22,-10],[-22,10],[-22,-10],[0,11],[0,-11]].map(([f,s])=>[x+ca*f-sa*s,y+sa*f+ca*s])}
function carHits(x,y,a){return corners(x,y,a).some(([px,py])=>solid(px,py))}
function move(c){const nx=c.x+Math.cos(c.a)*c.sp,ny=c.y+Math.sin(c.a)*c.sp;
  if(carHits(nx,ny,c.a)){const s=Math.abs(c.sp);if(s>4.5){damageCar(c,s*2.2,c===P.car?'self':null);puff(nx,ny,6,'#ffd54f',3,3,15);if(c===P.car)shake=Math.max(shake,s)}c.sp*=-.35;return true}
  c.x=nx;c.y=ny;return false}
function drive(c,acc,steer,hb){
  if(acc>0)c.sp+=acc*(c.sp<0?.35:.17);else if(acc<0)c.sp+=acc*(c.sp>0?.35:.12);
  c.sp*=hb?.93:.986;c.sp=clamp(c.sp,-4,c.max);
  const g=Math.min(1,Math.abs(c.sp)/2.5)*Math.sign(c.sp);c.a+=steer*.048*g*(hb?1.5:1);
  if(hb&&Math.abs(c.sp)>4&&frame%2===0)decals.push({x:c.x,y:c.y,r:3,t:'k',a:c.a});
  if(decals.length>160)decals.shift();
  return move(c)}
function steerTo(c,ta){const d=ang(ta-c.a);return clamp(d*2.5,-1,1)}

function nearestCar(){let best=null,bd=55;for(const c of cars){if(c.wreck)continue;const d=dist(c,P);if(d<bd){bd=d;best=c}}return best}
function exitSpot(c){const ca=Math.cos(c.a+PI/2),sa=Math.sin(c.a+PI/2);for(const s of[30,-30,45,-45]){const x=c.x+ca*s,y=c.y+sa*s;if(!solid(x,y)){P.x=x;P.y=y;return}}P.x=c.x;P.y=c.y}
function toggleCar(){if(P.dead)return;
  if(P.car){const c=P.car;if(Math.abs(c.sp)>3){msg('Slow down to get out','#ffd54f');return}c.driver=null;c.sp=0;P.car=null;exitSpot(c);return}
  const c=nearestCar();if(!c)return;
  if(c.driver==='npc'){const p=makePed(c.x,c.y);exitSpotPed(p,c);p.flee=300;peds.push(p);msg('Carjacked!','#ff6b6b');crime(.5)}
  if(c.driver==='cop'){crime(2);msg('Stole a cop car!','#4fc3f7')}
  c.driver='player';c.cop=false;c.panic=0;P.car=c}
function exitSpotPed(p,c){const ca=Math.cos(c.a-PI/2),sa=Math.sin(c.a-PI/2);p.x=c.x+ca*30;p.y=c.y+sa*30;if(solid(p.x,p.y)){p.x=c.x-ca*30;p.y=c.y-sa*30}}

// ---------- update ----------
function getInput(){let ix=0,iy=0;
  if(keys.KeyW||keys.ArrowUp)iy--;if(keys.KeyS||keys.ArrowDown)iy++;if(keys.KeyA||keys.ArrowLeft)ix--;if(keys.KeyD||keys.ArrowRight)ix++;
  let joyOn=false;if(joy.id!==null&&Math.hypot(joy.dx,joy.dy)>8){ix=joy.dx/60;iy=joy.dy/60;joyOn=true}
  return{ix,iy,joyOn,fire:mdown||fireT!==null}}
function screenToWorld(sx,sy){return{x:(sx-W/2)/cam.z+cam.x,y:(sy-H/2)/cam.z+cam.y}}

function update(){
  frame++;const w=wanted();
  if(P.dead){P.dead--;if(P.dead===0)respawn()}
  else{
    const inp=getInput();
    if(P.car){const c=P.car;let acc,steer;
      if(inp.joyOn){const m=Math.min(1,Math.hypot(inp.ix,inp.iy)),ta=Math.atan2(inp.iy,inp.ix),d=ang(ta-c.a);
        if(Math.abs(d)>2.4&&c.sp<2){acc=-m;steer=-clamp(d,-1,1)}else{acc=m;steer=steerTo(c,ta)}}
      else{acc=-inp.iy;steer=inp.ix}
      drive(c,acc,steer,keys.Space);P.x=c.x;P.y=c.y;P.a=c.a;
      if(c.hp<40&&frame%4===0)puff(c.x+Math.cos(c.a)*18,c.y+Math.sin(c.a)*18,1,c.hp<20?'#222':'#888',1,8,50);
    }else{
      const m=Math.hypot(inp.ix,inp.iy);if(m>.05){const s=(keys.ShiftLeft||keys.ShiftRight?4.2:2.9)*Math.min(1,m);
        const vx=inp.ix/m*s,vy=inp.iy/m*s;
        if(!solid(P.x+vx*2.5,P.y))P.x+=vx;if(!solid(P.x,P.y+vy*2.5))P.y+=vy;P.walk+=.3;if(touchMode)P.a=Math.atan2(vy,vx)}
    }
    if(!touchMode&&!P.car){const wp=screenToWorld(mx,my);P.a=Math.atan2(wp.y-P.y,wp.x-P.x)}
    P.cool--;if(inp.fire&&P.cool<=0){let a=P.a;if(P.car&&!touchMode){const wp=screenToWorld(mx,my);a=Math.atan2(wp.y-P.y,wp.x-P.x)}
      const off=P.car?28:14;shoot(P.x+Math.cos(a)*off,P.y+Math.sin(a)*off,a,'player');P.cool=P.car?9:7;scare(P.x,P.y,320)}
    P.hitCd--;
    for(const c of cars){if(c.wreck||c===P.car||P.car)continue;if(Math.abs(c.sp)>2.2&&Math.hypot(c.x-P.x,c.y-P.y)<22&&P.hitCd<=0){hurt(Math.abs(c.sp)*4);P.hitCd=30;const a=Math.atan2(P.y-c.y,P.x-c.x);if(!solid(P.x+Math.cos(a)*20,P.y+Math.sin(a)*20)){P.x+=Math.cos(a)*20;P.y+=Math.sin(a)*20}}}
    if(!P.car&&P.heat===0&&P.hp<100)P.hp+=.03;
    // pickups
    for(const k of pickups)if(!k.got&&Math.hypot(k.x-P.x,k.y-P.y)<26){k.got=1;P.money+=k.v;puff(k.x,k.y,6,'#7CFC00',2,3,20)}
    pickups=pickups.filter(k=>!k.got&&Math.hypot(k.x-P.x,k.y-P.y)<2000);
    // mission
    if(mission&&Math.hypot(mission.x-P.x,mission.y-P.y)<45){P.money+=mission.reward;msg(`Drop complete  +$${mission.reward}`,'#7CFC00');newMission()}
  }
  // police heat
  let seen=false;for(const c of cars)if(c.cop&&!c.wreck&&c.driver==='cop'&&Math.hypot(c.x-P.x,c.y-P.y)<650)seen=true;
  if(w>0){if(seen)P.lastSeen=0;else P.lastSeen++;if(P.lastSeen>480){P.heat=TH[w-1];P.lastSeen=0;msg(P.heat?'Wanted level dropped':'You lost the cops','#4fc3f7')}}
  // spawning
  const npcCount=cars.filter(c=>c.driver==='npc').length;
  if(npcCount<26&&frame%6===0){const s=laneSpot(650,1300);if(s)cars.push(makeCar(s.x,s.y,s.a,'npc'))}
  if(frame%8===0&&cars.filter(c=>!c.wreck).length<45)for(let i=0;i<3;i++){const s=laneSpot(500,900);if(s&&Math.random()<.15)cars.push(Object.assign(makeCar(s.x,s.y,s.a,null),{sp:0}))}
  const alive=peds.filter(p=>!p.dead).length;if(alive<55&&frame%4===0){const s=sidewalkSpot(600,1200);if(s)peds.push(makePed(s.x,s.y))}
  const copWant=[0,1,3,4,6,8][w],cops=cars.filter(c=>c.cop&&!c.wreck&&c.driver==='cop').length;
  if(!P.dead&&cops<copWant&&frame%40===0){const s=laneSpot(600,1000);if(s){const c=makeCar(s.x,s.y,s.a,'cop',true);c.sp=5;cars.push(c)}}
  // cars
  for(const c of cars){
    if(c.wreck){c.sp*=.9;if(Math.abs(c.sp)>.1)move(c);if(c.wreck<200){c.wreck++;if(frame%3===0)puff(c.x,c.y,1,c.wreck<90?'#ff7043':'#333',1.2,9,60)}continue}
    if(c.driver==='npc'){
      if(c.panic>0){c.panic--;drive(c,1,steerTo(c,c.la)*.8,false);if(Math.abs(c.sp)<.5){c.stuck++;if(c.stuck>60){c.a+=PI*.5;c.stuck=0}}}
      else{
        let block=false;const ca=Math.cos(c.a),sa=Math.sin(c.a);
        for(const d of[40,70]){const px=c.x+ca*d,py=c.y+sa*d;
          if((!P.car&&!P.dead&&Math.hypot(P.x-px,P.y-py)<26))block=true;
          for(const o of cars)if(o!==c&&Math.hypot(o.x-px,o.y-py)<28){block=true;break}
          if(block)break}
        if(c.stun>0)c.stun--;
        const target=(block||c.stun>0)?0:3.2;c.sp+=(target-c.sp)*.08;
        c.a+=ang(c.la-c.a)*.1;
        if(Math.abs(Math.cos(c.la))>.5){const ly=Math.floor(c.y/CELL)*CELL+(Math.cos(c.la)>0?72:28);if(c.y%CELL<ROAD)c.y+=(ly-c.y)*.04}
        else{const lx=Math.floor(c.x/CELL)*CELL+(Math.sin(c.la)>0?28:72);if(c.x%CELL<ROAD)c.x+=(lx-c.x)*.04}
        if(move(c))c.stun=90;
        // turn at intersections sometimes
        const cx=c.x%CELL,cy=c.y%CELL;
        if(cx<ROAD&&cy<ROAD&&!c.turned&&Math.random()<.02&&Math.abs(c.sp)>1){const o=[c.la+PI/2,c.la-PI/2][(Math.random()*2)|0];c.la=ang(o);c.turned=1}
        if(!(cx<ROAD&&cy<ROAD))c.turned=0;
      }
    }else if(c.driver==='cop'){
      if(w===0||P.dead){c.sp*=.97;move(c)}
      else{
        const d=Math.hypot(P.x-c.x,P.y-c.y),ta=Math.atan2(P.y-c.y,P.x-c.x),df=ang(ta-c.a);
        if(c.rev>0){c.rev--;drive(c,-1,-Math.sign(df),false)}
        else{const acc=d<60&&!P.car?-.3:(Math.abs(df)<1.6?1:.4);drive(c,acc,steerTo(c,ta),Math.abs(df)>1.2&&c.sp>5);
          if(Math.abs(c.sp)<.8){if(++c.stuck>45){c.rev=35;c.stuck=0}}else c.stuck=0}
        if(w>=2&&d<380&&(frame+c.id*7)%Math.max(18,60-w*8)===0)shoot(c.x,c.y,ta,'cop',.12);
      }
      if(frame%2===0)c.flash=!c.flash;
    }else if(c.driver===null){c.sp*=.95;if(Math.abs(c.sp)>.05)move(c)}
  }
  // car-car collisions
  for(let i=0;i<cars.length;i++)for(let j=i+1;j<cars.length;j++){const a=cars[i],b=cars[j];const dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
    if(d<40&&d>0){const nx=dx/d,ny=dy/d,o=(40-d)/2;
      if(!carHits(a.x-nx*o,a.y-ny*o,a.a)){a.x-=nx*o;a.y-=ny*o}if(!carHits(b.x+nx*o,b.y+ny*o,b.a)){b.x+=nx*o;b.y+=ny*o}
      const rel=Math.abs(a.sp-b.sp*Math.cos(a.a-b.a));
      if(rel>3.5){const src=(a===P.car||b===P.car)?'player':null;damageCar(a,rel*1.6,src===null?null:(b===P.car?'player':null));damageCar(b,rel*1.6,a===P.car?'player':null);
        puff((a.x+b.x)/2,(a.y+b.y)/2,8,'#ffd54f',3,3,15);if(src)shake=Math.max(shake,rel*.8);
        for(const c of[a,b])if(c.driver==='npc'){c.panic=150;c.stun=60}
        if((a.cop&&b===P.car)||(b.cop&&a===P.car))P.lastSeen=0}
      const avg=(a.sp+b.sp)/2;a.sp=a.sp*.6+avg*.1;b.sp=b.sp*.6+avg*.1}}
  // peds
  for(const p of peds){if(p.dead)continue;
    const fleeing=p.flee>0;let s=fleeing?2.5:.75;
    if(fleeing){p.flee--;const aw=Math.atan2(p.y-P.y,p.x-P.x);p.a+=ang(aw-p.a)*.1+rnd(-.2,.2)}
    else if(Math.random()<.01)p.a+=rnd(-1.6,1.6);
    const nx=p.x+Math.cos(p.a)*s,ny=p.y+Math.sin(p.a)*s;
    if(solid(nx,ny)||(!fleeing&&isRoad(nx,ny)&&!isRoad(p.x,p.y))){p.a+=PI*rnd(.5,1.5)}else{p.x=nx;p.y=ny;p.step+=s*.25}
    for(const c of cars){if(Math.abs(c.sp)>1.8&&!c.wreck&&Math.hypot(c.x-p.x,c.y-p.y)<24){killPed(p,c===P.car?'player':null);break}}
  }
  // bullets
  for(const b of bullets){for(let s=0;s<2&&b.life>0;s++){b.x+=b.vx/2;b.y+=b.vy/2;
      if(solid(b.x,b.y)){b.life=0;puff(b.x,b.y,3,'#bbb',1.5,2,12);break}
      if(b.owner==='player'){
        for(const p of peds)if(!p.dead&&Math.hypot(p.x-b.x,p.y-b.y)<10){killPed(p,'player');b.life=0;break}
        if(b.life)for(const c of cars)if(c!==P.car&&!c.wreck&&Math.hypot(c.x-b.x,c.y-b.y)<22){damageCar(c,c.cop?12:16,'player');if(c.driver==='npc')c.panic=200;puff(b.x,b.y,3,'#ffd54f',2,2,10);b.life=0;break}
      }else{
        if(P.car&&Math.hypot(P.car.x-b.x,P.car.y-b.y)<22){damageCar(P.car,5,'cop');b.life=0}
        else if(!P.car&&!P.dead&&Math.hypot(P.x-b.x,P.y-b.y)<11){hurt(6);blood(P.x,P.y);b.life=0}
      }}b.life--}
  bullets=bullets.filter(b=>b.life>0);
  for(const q of parts){q.x+=q.vx;q.y+=q.vy;q.vx*=.93;q.vy*=.93;q.life--}parts=parts.filter(q=>q.life>0);
  if(parts.length>700)parts.splice(0,parts.length-700);
  // despawn far things
  cars=cars.filter(c=>c===P.car||Math.hypot(c.x-P.x,c.y-P.y)<(c.cop&&w>0?2600:1700));
  peds=peds.filter(p=>Math.hypot(p.x-P.x,p.y-P.y)<1500);
  for(const m of msgs)m.life--;msgs=msgs.filter(m=>m.life>0);
  // camera
  const lead=P.car?18:0,tx=P.x+Math.cos(P.a)*(P.car?P.car.sp*lead:0),ty=P.y+Math.sin(P.a)*(P.car?P.car.sp*lead:0);
  cam.x+=(tx-cam.x)*.1;cam.y+=(ty-cam.y)*.1;
  const base=Math.min(1.15,Math.max(.75,Math.min(W,H)/620));
  const tz=base*(P.car?1-Math.min(.3,Math.abs(P.car.sp)*.03):1);cam.z+=(tz-cam.z)*.05;
  shake*=.88;
}

// ---------- draw ----------
function drawCity(){
  const tl=screenToWorld(0,0),br=screenToWorld(W,H);
  X.fillStyle='#2b2d31';X.fillRect(tl.x,tl.y,br.x-tl.x,br.y-tl.y);
  X.fillStyle='#0b2a3a';// sea outside the city
  if(tl.x<0)X.fillRect(tl.x,tl.y,-tl.x,br.y-tl.y);if(tl.y<0)X.fillRect(tl.x,tl.y,br.x-tl.x,-tl.y);
  if(br.x>WORLD)X.fillRect(WORLD,tl.y,br.x-WORLD,br.y-tl.y);if(br.y>WORLD)X.fillRect(tl.x,WORLD,br.x-tl.x,br.y-WORLD);
  const i0=Math.max(0,Math.floor(tl.x/CELL)),i1=Math.min(N-1,Math.floor(br.x/CELL)),j0=Math.max(0,Math.floor(tl.y/CELL)),j1=Math.min(N-1,Math.floor(br.y/CELL));
  // lane lines
  X.strokeStyle='#d4a72c';X.lineWidth=2;X.setLineDash([22,18]);X.beginPath();
  for(let k=Math.max(0,i0);k<=Math.min(N,i1+1);k++){X.moveTo(k*CELL+50,Math.max(0,tl.y));X.lineTo(k*CELL+50,Math.min(WORLD,br.y))}
  for(let k=Math.max(0,j0);k<=Math.min(N,j1+1);k++){X.moveTo(Math.max(0,tl.x),k*CELL+50);X.lineTo(Math.min(WORLD,br.x),k*CELL+50)}
  X.stroke();X.setLineDash([]);
  for(let i=i0;i<=i1;i++)for(let j=j0;j<=j1;j++){const c=cells[i][j],x=i*CELL,y=j*CELL;
    // crosswalks
    X.fillStyle='rgba(235,235,235,.55)';for(let s=0;s<6;s++){X.fillRect(x+ROAD+2,y+12+s*14,10,8);X.fillRect(x+12+s*14,y+ROAD+2,8,10)}
    X.fillStyle='#8d8f93';X.fillRect(x+ROAD,y+ROAD,CELL-ROAD,CELL-ROAD);
    if(c.park){X.fillStyle='#3d7a3a';X.fillRect(x+ROAD+SW,y+ROAD+SW,CELL-ROAD-2*SW,CELL-ROAD-2*SW);
      X.fillStyle='#c9b58a';X.fillRect(x+240,y+ROAD+SW,20,CELL-ROAD-2*SW);X.fillRect(x+ROAD+SW,y+240,CELL-ROAD-2*SW,20);
      for(const[tx,ty,r]of c.trees){X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.arc(x+tx+5,y+ty+5,r,0,7);X.fill();X.fillStyle='#2f6b2c';X.beginPath();X.arc(x+tx,y+ty,r,0,7);X.fill();X.fillStyle='#4c9a45';X.beginPath();X.arc(x+tx-r*.3,y+ty-r*.3,r*.5,0,7);X.fill()}}
    else{const bx=x+ROAD+SW,by=y+ROAD+SW,bw=CELL-ROAD-2*SW;
      X.fillStyle='rgba(0,0,0,.4)';X.fillRect(bx+14,by+14,bw,bw);
      X.fillStyle=c.col;X.fillRect(bx,by,bw,bw);X.fillStyle=c.roof;X.fillRect(bx+10,by+10,bw-20,bw-20);
      X.fillStyle='rgba(0,0,0,.22)';for(const[ax,ay,aw,ah]of c.ac)X.fillRect(x+ax,y+ay,aw,ah);
      X.strokeStyle='rgba(255,255,255,.08)';X.lineWidth=2;X.strokeRect(bx+10,by+10,bw-20,bw-20)}
  }
  // hospital marker
  X.fillStyle='#fff';X.fillRect(HOSP.x-14,HOSP.y-4+40,28,8);X.fillRect(HOSP.x-4,HOSP.y-14+40,8,28);
}
function drawCar(c){X.save();X.translate(c.x,c.y);X.rotate(c.a);
  X.fillStyle='rgba(0,0,0,.35)';X.fillRect(-21,-8,48,24);
  X.fillStyle=c.wreck?'#1c1c1c':c.col;X.fillRect(-24,-11,48,22);
  if(c.cop&&!c.wreck){X.fillStyle='#f5f5f5';X.fillRect(-10,-11,22,22)}
  X.fillStyle=c.wreck?'#111':'rgba(15,25,35,.9)';X.fillRect(5,-9,8,18);X.fillRect(-17,-9,6,18);
  X.fillStyle='rgba(255,255,255,.12)';X.fillRect(-11,-8,16,16);
  if(!c.wreck){X.fillStyle='#fff7c2';X.fillRect(22,-9,3,5);X.fillRect(22,4,3,5);X.fillStyle='#d50000';X.fillRect(-25,-9,2,5);X.fillRect(-25,4,2,5)}
  if(c.cop&&!c.wreck){X.fillStyle=c.flash?'#ff1744':'#2979ff';X.fillRect(-3,-9,5,9);X.fillStyle=c.flash?'#2979ff':'#ff1744';X.fillRect(-3,0,5,9);
    if(c.driver==='cop'){X.globalAlpha=.18;X.fillStyle=c.flash?'#ff1744':'#2979ff';X.beginPath();X.arc(0,0,46,0,7);X.fill();X.globalAlpha=1}}
  X.restore()}
function drawPed(p,isPlayer){X.save();X.translate(p.x,p.y);X.rotate(p.a);
  if(p.dead){X.fillStyle=p.shirt;X.fillRect(-9,-5,16,10);X.fillStyle=p.skin;X.beginPath();X.arc(10,0,4,0,7);X.fill();X.restore();return}
  const sw=Math.sin(p.step)*4;X.fillStyle='#222';X.fillRect(-2+sw,-6,6,4);X.fillRect(-2-sw,2,6,4);
  X.fillStyle='rgba(0,0,0,.3)';X.beginPath();X.arc(2,2,8,0,7);X.fill();
  X.fillStyle=p.shirt;X.beginPath();X.ellipse(0,0,5,8,0,0,7);X.fill();
  if(isPlayer){X.fillStyle='#333';X.fillRect(4,3,13,3)}
  X.fillStyle=p.skin;X.beginPath();X.arc(1,0,4.4,0,7);X.fill();
  if(isPlayer){X.fillStyle='#2b1a0e';X.beginPath();X.arc(0,0,4.4,PI*.6,PI*1.4);X.fill()}
  X.restore()}
const PLAYER_LOOK={shirt:'#f4f1e8',skin:'#c68642'};
function txt(s,x,y,size,col,align='left',stroke=4){X.font=`${size}px ${FONT}`;X.textAlign=align;X.textBaseline='middle';X.lineJoin='round';X.lineWidth=stroke;X.strokeStyle='#000';X.strokeText(s,x,y);X.fillStyle=col;X.fillText(s,x,y)}

function draw(){
  X.setTransform(DPR,0,0,DPR,0,0);
  const sx=rnd(-shake,shake)*.6,sy=rnd(-shake,shake)*.6;
  X.setTransform(cam.z*DPR,0,0,cam.z*DPR,(W/2-cam.x*cam.z+sx)*DPR,(H/2-cam.y*cam.z+sy)*DPR);
  drawCity();
  for(const d of decals){if(d.t==='b'){X.fillStyle='rgba(120,0,0,.75)';X.beginPath();X.arc(d.x,d.y,d.r,0,7);X.fill()}
    else if(d.t==='s'){X.fillStyle='rgba(0,0,0,.45)';X.beginPath();X.arc(d.x,d.y,d.r,0,7);X.fill()}
    else{X.fillStyle='rgba(0,0,0,.35)';X.save();X.translate(d.x,d.y);X.rotate(d.a);X.fillRect(-20,-10,6,4);X.fillRect(-20,6,6,4);X.restore()}}
  if(mission){const pu=1+Math.sin(frame*.1)*.15;X.fillStyle='rgba(255,213,0,.25)';X.beginPath();X.arc(mission.x,mission.y,40*pu,0,7);X.fill();X.strokeStyle='#ffd500';X.lineWidth=4;X.beginPath();X.arc(mission.x,mission.y,28*pu,0,7);X.stroke()}
  for(const k of pickups){X.fillStyle='#2e7d32';X.fillRect(k.x-8,k.y-5,16,10);X.fillStyle='#a5d6a7';X.font=`10px ${FONT}`;X.textAlign='center';X.textBaseline='middle';X.fillText('$',k.x,k.y+1)}
  for(const p of peds)if(p.dead)drawPed(p);
  for(const p of peds)if(!p.dead)drawPed(p);
  if(!P.car)drawPed(P.dead?{...PLAYER_LOOK,x:P.x,y:P.y,a:P.a,dead:1}:{...PLAYER_LOOK,x:P.x,y:P.y,a:P.a,step:P.walk},true);
  for(const c of cars)drawCar(c);
  X.fillStyle='#ffe082';for(const b of bullets){X.fillRect(b.x-2,b.y-2,4,4)}
  for(const q of parts){X.globalAlpha=Math.max(0,q.life/q.max);X.fillStyle=q.col;X.beginPath();X.arc(q.x,q.y,q.size*(1.5-q.life/q.max*.5),0,7);X.fill()}X.globalAlpha=1;
  X.setTransform(DPR,0,0,DPR,0,0);
  hud();
}
function hud(){
  const w=wanted(),R=W-16;
  txt('$'+String(P.money).padStart(8,'0'),R,30,30,'#9ccc65','right',5);
  for(let i=0;i<5;i++){const on=i<w,blink=on&&P.lastSeen>0&&frame%30<15;star(R-12-i*28,64,11,on?(blink?'#888':'#fff'):'rgba(255,255,255,.18)')}
  // health + armor bars
  const bw=Math.min(180,W*.4);X.fillStyle='rgba(0,0,0,.6)';X.fillRect(R-bw,84,bw,10);X.fillStyle=P.hp>30?'#43a047':'#e53935';X.fillRect(R-bw+2,86,(bw-4)*Math.max(0,P.hp)/100,6);
  if(P.car){X.fillStyle='rgba(0,0,0,.6)';X.fillRect(R-bw,98,bw,8);X.fillStyle='#29b6f6';X.fillRect(R-bw+2,100,(bw-4)*Math.max(0,P.car.hp)/(P.car.max>8.6?100:140),4);
    txt(Math.round(Math.abs(P.car.sp)*14)+' km/h',R,122,16,'#fff','right',3)}
  minimap();
  // mission readout
  if(mission&&!P.dead){const d=Math.round(Math.hypot(mission.x-P.x,mission.y-P.y)/8);txt(`DROP-OFF  ${d} m   ·   $${mission.reward}`,W/2,H-24-(touchMode?0:0),17,'#ffd500','center',4);
    const a=Math.atan2(mission.y-P.y,mission.x-P.x);X.save();X.translate(W/2,H-56);X.rotate(a);X.fillStyle='#ffd500';X.strokeStyle='#000';X.lineWidth=2;X.beginPath();X.moveTo(14,0);X.lineTo(-8,-9);X.lineTo(-3,0);X.lineTo(-8,9);X.closePath();X.fill();X.stroke();X.restore()}
  let y=H*.28;for(const m of msgs){if(!m.t)continue;X.globalAlpha=Math.min(1,m.life/30);txt(m.t,W/2,y,24,m.col,'center',5);y+=32}X.globalAlpha=1;
  if(frame<600&&!P.dead){X.globalAlpha=Math.min(1,(600-frame)/60);const lines=touchMode?['Left stick: move / drive','FIRE: shoot   CAR: get in / out']:['WASD: move / drive   Shift: run   Space: handbrake','Mouse: aim + click to shoot   E: get in / out of cars'];
    lines.forEach((l,i)=>txt(l,W/2,H*.62+i*24,16,'#fff','center',4));X.globalAlpha=1}
  if(P.dead){X.fillStyle=`rgba(40,40,40,${Math.min(.6,(200-P.dead)/80)})`;X.fillRect(0,0,W,H);txt('WASTED',W/2,H/2,Math.min(110,W/5),'#d32f2f','center',8)}
  if(touchMode)touchUI();
}
function star(x,y,r,col){X.beginPath();for(let i=0;i<10;i++){const rr=i%2?r*.45:r,a=-PI/2+i*PI/5;X.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}X.closePath();X.fillStyle=col;X.strokeStyle='#000';X.lineWidth=3;X.stroke();X.fill()}
function minimap(){const S=Math.min(150,W*.32),x0=14,y0=14,R=1300,sc=S/(R*2);
  X.save();X.beginPath();X.arc(x0+S/2,y0+S/2,S/2,0,7);X.fillStyle='rgba(20,24,28,.85)';X.fill();X.clip();
  const toM=(wx,wy)=>[x0+S/2+(wx-P.x)*sc,y0+S/2+(wy-P.y)*sc];
  X.fillStyle='#55595f';for(let k=0;k<=N;k++){let[a]=toM(k*CELL,0);X.fillRect(a,y0,ROAD*sc,S);let[,b]=toM(0,k*CELL);X.fillRect(x0,b,S,ROAD*sc)}
  for(let i=0;i<N;i++)for(let j=0;j<N;j++)if(cells[i][j].park){const[a,b]=toM(i*CELL+ROAD,j*CELL+ROAD);X.fillStyle='#3d7a3a';X.fillRect(a,b,(CELL-ROAD)*sc,(CELL-ROAD)*sc)}
  for(const c of cars)if(c.cop&&!c.wreck){const[a,b]=toM(c.x,c.y);X.fillStyle=frame%20<10?'#ff1744':'#2979ff';X.fillRect(a-3,b-3,6,6)}
  {const[a,b]=toM(HOSP.x,HOSP.y);X.fillStyle='#fff';X.fillRect(a-1,b-4,2,8);X.fillRect(a-4,b-1,8,2)}
  X.restore();
  if(mission){let[a,b]=toM(mission.x,mission.y);const cx=x0+S/2,cy=y0+S/2,d=Math.hypot(a-cx,b-cy);if(d>S/2-6){a=cx+(a-cx)/d*(S/2-6);b=cy+(b-cy)/d*(S/2-6)}X.fillStyle='#ffd500';X.strokeStyle='#000';X.lineWidth=2;X.beginPath();X.arc(a,b,5,0,7);X.fill();X.stroke()}
  X.save();X.translate(x0+S/2,y0+S/2);X.rotate(P.a);X.fillStyle='#fff';X.beginPath();X.moveTo(7,0);X.lineTo(-5,-5);X.lineTo(-5,5);X.closePath();X.fill();X.restore();
  X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=2;X.beginPath();X.arc(x0+S/2,y0+S/2,S/2,0,7);X.stroke();
}
function touchUI(){for(const b of btns()){X.fillStyle=b.n==='fire'&&fireT!==null?'rgba(211,47,47,.6)':'rgba(255,255,255,.15)';X.strokeStyle='rgba(255,255,255,.5)';X.lineWidth=2;X.beginPath();X.arc(b.x,b.y,b.r,0,7);X.fill();X.stroke();txt(b.l,b.x,b.y,b.r*.5,'#fff','center',3)}
  if(joy.id!==null){X.strokeStyle='rgba(255,255,255,.4)';X.lineWidth=2;X.beginPath();X.arc(joy.sx,joy.sy,60,0,7);X.stroke();X.fillStyle='rgba(255,255,255,.35)';X.beginPath();X.arc(joy.sx+joy.dx,joy.sy+joy.dy,24,0,7);X.fill()}
  else txt('drag to move',90,H-60,14,'rgba(255,255,255,.5)','center',3)}

// ---------- boot ----------
for(let i=0;i<20;i++){const s=laneSpot(150,1200);if(s)cars.push(makeCar(s.x,s.y,s.a,'npc'))}
for(let i=0;i<50;i++){const s=sidewalkSpot(60,1100);if(s)peds.push(makePed(s.x,s.y))}
{const s=laneSpot(40,200);const c=makeCar(HOSP.x+60,HOSP.y-28,0,null);c.sp=0;c.col='#ff6b9d';c.max=11.5;cars.push(c)}
newMission();
let last=performance.now(),acc=0;
function loop(t){acc+=Math.min(100,t-last);last=t;while(acc>=16.67){update();acc-=16.67}draw();requestAnimationFrame(loop)}
requestAnimationFrame(loop);
</script>
